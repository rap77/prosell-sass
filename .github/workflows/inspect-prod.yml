name: Inspect Prod (Read-Only Diagnostic)

# Workflow temporal para leer estado de la DB de prod via SSH. SOLO manual,
# SOLO lectura: no corre migraciones ni modifica datos. Diseñado para ser
# commiteado, ejecutado UNA vez, y borrado en commit siguiente.
on:
  workflow_dispatch:

concurrency:
  group: inspect-prod
  cancel-in-progress: false

jobs:
  inspect-prod:
    runs-on: ubuntu-latest
    steps:
      - id: ssh
        name: Read-only diagnostic queries against prod DB
        # Pineado al mismo SHA que promote-prod.yml (v1.2.5) — mismo action,
        # mismas credenciales SSH de prod. Si comprometen la action, te roban
        # la llave de prod.
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 10m
          # capture_stdout=true pone el output del comando remoto en
          # `steps.ssh.outputs.stdout` Y lo streamea al log del step vía tee.
          # Confirmado en entrypoint.sh del action (v1.2.5):
          #   `"${TARGET}" "$@" | tee -a "${GITHUB_OUTPUT}"` cuando capture_stdout=true.
          # El bug que vimos antes fue que pusimos el script en `script:`
          # con redirección a archivo: ahí el stdout del script no es el
          # stdout del comando que drone-ssh ejecuta. Con `command:`, drone-ssh
          # sí streamea el stdout del proceso ssh directo.
          #
          # NOTA: appleboy/ssh-action v1.2.5 NO tiene input `command:` —
          # solo `script:` y `script_path:`. Por eso usamos `script:` aquí.
          # El truco es: el `script:` hace un único `docker exec ... psql ...`,
          # y docker/psql stream-a el output vía SSH, que drone-ssh captura.
          capture_stdout: true
          script: |
            set -e
            cd ${{ secrets.PROD_REPO_PATH || '/prosell' }}
            set -a
            # shellcheck disable=SC1091
            source .env.prod
            set +a
            if [ -z "${POSTGRES_USER:-}" ] || [ -z "${POSTGRES_DB:-}" ] || [ -z "${POSTGRES_PASSWORD:-}" ]; then
              echo "ERROR: .env.prod no contiene POSTGRES_USER/POSTGRES_DB/POSTGRES_PASSWORD"
              exit 1
            fi
            # Único docker exec + psql con varias -c flags. La salida de psql
            # (stdout) fluye vía SSH → drone-ssh → action stdout.
            docker exec -e PGPASSWORD="$POSTGRES_PASSWORD" prosell-prod-db \
              psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" --no-psqlrc \
                -c "\echo '--- alembic_version ---'" \
                -c "SELECT version_num FROM alembic_version;" \
                -c "\echo '--- categories.carros-y-camionetas make.options ---'" \
                -c "SELECT slug, jsonb_pretty(attribute_schema->'make'->'options') AS make_options FROM categories WHERE slug='carros-y-camionetas';" \
                -c "\echo '--- published product count ---'" \
                -c "SELECT COUNT(*) AS published_count FROM products WHERE status='published';" \
                -c "\echo '--- first published product make attributes ---'" \
                -c "SELECT jsonb_pretty(attributes->'make') AS make_attrs FROM products WHERE status='published' LIMIT 1;"

      # Emitir el output capturado. `if: always()` para que aún en error se
      # vea el output.
      - name: Print captured diagnostic output
        if: always()
        env:
          DIAG_OUT: ${{ steps.ssh.outputs.stdout }}
        run: printf '%s\n' "$DIAG_OUT"
