name: Inspect Prod (Read-Only Diagnostic)

# Workflow temporal para leer estado de la DB de prod via SSH. SOLO manual,
# SOLO lectura: no corre migraciones ni modifica datos. Diseñado para ser
# commiteado, ejecutado UNA vez, y borrado en commit siguiente.
on:
  workflow_dispatch:

concurrency:
  group: inspect-prod
  cancel-in-progress: false

jobs:
  inspect-prod:
    runs-on: ubuntu-latest
    steps:
      - name: Read-only diagnostic queries against prod DB
        # Pineado al mismo SHA que promote-prod.yml (v1.2.5) — mismo action,
        # mismas credenciales SSH de prod. Si comprometen la action, te roban
        # la llave de prod.
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # Queries read-only — 10m es margen amplio para 4 SELECTs.
          command_timeout: 10m
          script: |
            set -e
            # Mismo fallback que promote-prod.yml — backward-compatible si el
            # secret PROD_REPO_PATH no está seteado.
            cd ${{ secrets.PROD_REPO_PATH || '/prosell' }}

            # Cargar .env.prod en silencio. set -a + source + set +a es el
            # patrón estándar POSIX; sin `set -x`, los valores de POSTGRES_*
            # nunca se imprimen al log de Actions.
            set -a
            # shellcheck disable=SC1091
            source .env.prod
            set +a

            # Verificación mínima: si los vars no se cargaron, abortar antes
            # de intentar psql — evita mensajes de error crípticos.
            if [ -z "${POSTGRES_USER:-}" ] || [ -z "${POSTGRES_DB:-}" ] || [ -z "${POSTGRES_PASSWORD:-}" ]; then
              echo "ERROR: .env.prod no contiene POSTGRES_USER/POSTGRES_DB/POSTGRES_PASSWORD"
              exit 1
            fi

            # Queries read-only. PGPASSWORD va por env (no en línea de comandos),
            # y NO se hace echo de su valor en ningún punto.
            # `--no-psqlrc` evita cargar config de usuario que puede no existir
            # en el container.
            docker exec -e PGPASSWORD="$POSTGRES_PASSWORD" prosell-prod-db \
              psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" --no-psqlrc <<'SQL'
            \echo '--- alembic_version ---'
            SELECT version_num FROM alembic_version;

            \echo '--- categories.carros-y-camionetas make.options ---'
            SELECT slug,
                   jsonb_pretty(attribute_schema->'make'->'options') AS make_options
            FROM categories
            WHERE slug = 'carros-y-camionetas';

            \echo '--- published product count ---'
            SELECT COUNT(*) AS published_count
            FROM products
            WHERE status = 'published';

            \echo '--- first published product make attributes ---'
            SELECT jsonb_pretty(attributes->'make') AS make_attrs
            FROM products
            WHERE status = 'published'
            LIMIT 1;
            SQL
