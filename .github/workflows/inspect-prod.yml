name: Inspect Prod (Read-Only Diagnostic)

# Workflow TEMPORAL para leer estado de la DB de prod vía SSH. SOLO manual
# (workflow_dispatch), SOLO lectura: no corre alembic ni modifica datos ni
# archivos del host. Diseñado para commit → run → remove en commit siguiente.
on:
  workflow_dispatch:

concurrency:
  group: inspect-prod
  cancel-in-progress: false

jobs:
  inspect-prod:
    runs-on: ubuntu-latest
    # 30m de margen — las 3 SELECTs tardan segundos, el resto es SSH overhead.
    timeout-minutes: 30
    steps:
      - id: ssh
        name: Read-only diagnostic queries against prod DB
        # Pineado al mismo SHA que promote-prod.yml (v1.2.5) — mismo action,
        # mismas credenciales SSH de prod. Si comprometen el action, te roban
        # la llave de prod.
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # 10m es margen amplio para 3 SELECTs sobre la DB de prod.
          command_timeout: 10m
          # capture_stdout=true streamea el output del comando remoto vía tee
          # al log del step Y al buffer outputs.stdout (entrypoint.sh del
          # action v1.2.5 hace `"${TARGET}" "$@" | tee -a "${GITHUB_OUTPUT}"`).
          # El step siguiente lo re-emite como backup por si el tee perdiera
          # output por truncamiento del buffer de GITHUB_OUTPUT.
          capture_stdout: true
          script: |
            set -e
            # Mismo fallback que promote-prod.yml — backward-compatible si el
            # secret PROD_REPO_PATH no está seteado.
            cd ${{ secrets.PROD_REPO_PATH || '/prosell' }}

            # Cargar .env.prod en silencio. set -a + source + set +a es el
            # patrón estándar POSIX; sin `set -x`, los valores de POSTGRES_*
            # nunca se imprimen al log de Actions.
            set -a
            # shellcheck disable=SC1091
            source .env.prod
            set +a

            # Verificación mínima: si los vars no se cargaron, abortar antes
            # de intentar psql — evita mensajes de error crípticos.
            if [ -z "${POSTGRES_USER:-}" ] || [ -z "${POSTGRES_DB:-}" ] || [ -z "${POSTGRES_PASSWORD:-}" ]; then
              echo "ERROR: .env.prod no contiene POSTGRES_USER/POSTGRES_DB/POSTGRES_PASSWORD"
              exit 1
            fi

            # PGPASSWORD va por env (no en línea de comandos) — no aparece en
            # `ps` ni en el historial de bash, y NO se hace echo en ningún
            # punto del script.

            # Q1: 5 productos publicados más recientes con title_status
            # (para ver los valores reales que están persistidos).
            echo "--- query 1: 5 recent published products with title_status ---"
            docker exec -e "PGPASSWORD=$POSTGRES_PASSWORD" prosell-prod-db \
              psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc \
              "SELECT title, jsonb_pretty(attributes->'title_status') FROM products WHERE status='published' ORDER BY created_at DESC LIMIT 5;"

            # Q2: cuántos productos publicados tienen la clave title_status
            # (numerador: producto con el campo presente).
            echo "--- query 2: published products with title_status key ---"
            docker exec -e "PGPASSWORD=$POSTGRES_PASSWORD" prosell-prod-db \
              psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc \
              "SELECT COUNT(*) FROM products WHERE status='published' AND attributes ? 'title_status';"

            # Q3: total de productos publicados (denominador: universo total).
            echo "--- query 3: total published products ---"
            docker exec -e "PGPASSWORD=$POSTGRES_PASSWORD" prosell-prod-db \
              psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc \
              "SELECT COUNT(*) FROM products WHERE status='published';"

      # Backup: re-emite el stdout capturado por el SSH action. Útil si el
      # streaming en vivo (tee) se truncó por el límite de GITHUB_OUTPUT.
      # `if: always()` para que aún en error parcial se vea el output.
      - name: Print captured diagnostic output
        if: always()
        env:
          DIAG_OUT: ${{ steps.ssh.outputs.stdout }}
        run: printf '%s\n' "$DIAG_OUT"
